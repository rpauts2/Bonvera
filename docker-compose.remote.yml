services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      ADMINS: ${ADMINS:?Set ADMINS in .env}
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      HASH_SALT: ${HASH_SALT:?Set HASH_SALT in .env}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:?Set PHONE_ENCRYPTION_KEY in .env}
      POSTBACK_SECRET: ${POSTBACK_SECRET:?Set POSTBACK_SECRET in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WEB_PORT: ${WEB_PORT:-8080}
    ports:
      - "8080:8080"
    volumes:
      - "./data:/app/data"
      - "./assets:/app/assets"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
