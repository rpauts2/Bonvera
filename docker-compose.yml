services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cashback
      POSTGRES_USER: cashback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashback -d cashback"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 384m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 192m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  bot:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    env_file: .env
    environment:
      DB_URL: postgresql+asyncpg://cashback:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cashback
      REDIS_URL: redis://redis:6379/0
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8080:8080"]
    volumes: ["./data:/app/data", "./assets:/app/assets"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  postgres_data:
  redis_data:
