services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cashback
      POSTGRES_USER: cashback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashback -d cashback"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    environment:
      DB_URL: postgresql+asyncpg://cashback:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cashback
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8080:8080"]
    volumes: ["./data:/app/data", "./assets:/app/assets"]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
